name: Storefront checks
on:
  push:
    branches: [codex/storefront-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Install isolated browser-test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - run: node tests/images-browser.mjs
      # Owner switches (delivery, payments, social, trust pages, PayPal, indexing) are off in data/;
      # build and test them switched on too, then rebuild the committed state for the image audit.
      - run: npm run gate:preview
      - run: npm run gate:all-on
      - run: npm run gate:proposal
      - run: npm run gate:policies
      - run: npm run check:indexing
      - name: Rebuild the committed state
        run: npm run build && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read independent QA image checks at the handoff snapshot
        run: |
          python -m pip install Pillow==11.3.0
          git fetch --depth=1 origin 97780b00907571e64703daa3adfd5f03d5d5263d
          mkdir -p test-results/qa
          git show 97780b00907571e64703daa3adfd5f03d5d5263d:qa/scripts/image-provenance.py > test-results/qa/image-provenance.py
          git show 97780b00907571e64703daa3adfd5f03d5d5263d:qa/e2e/image-audit.mjs > test-results/qa/image-audit.mjs
          python -I test-results/qa/image-provenance.py public/assets/*
      - name: Run independent QA responsive image audit
        run: |
          node scripts/serve.mjs > test-results/image-server.log 2>&1 &
          BASE_URL=http://127.0.0.1:4173 QA_SHA="$GITHUB_SHA" OUT_DIR=test-results/qa/image-audit node test-results/qa/image-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-check-output
          path: |
            test-results/
            dist/
