name: Storefront checks
on:
  push:
    branches: [codex/storefront-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reproducible photo derivatives
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare-images.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Install isolated browser-test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - run: node tests/images-browser.mjs
      - name: Read independent QA image checks at the handoff snapshot
        run: |
          git fetch --depth=1 origin aedc1e4a3dc4a4f7292f26776821e2a79db3f300
          mkdir -p test-results/qa
          git show aedc1e4a3dc4a4f7292f26776821e2a79db3f300:qa/scripts/image-provenance.py > test-results/qa/image-provenance.py
          git show aedc1e4a3dc4a4f7292f26776821e2a79db3f300:qa/e2e/image-audit.mjs > test-results/qa/image-audit.mjs
          python -I test-results/qa/image-provenance.py public/assets/*
      - name: Run independent QA responsive image audit
        run: |
          node scripts/serve.mjs > test-results/image-server.log 2>&1 &
          BASE_URL=http://127.0.0.1:4173 QA_SHA="$GITHUB_SHA" OUT_DIR=test-results/qa/image-audit node test-results/qa/image-audit.mjs
      - name: Save the verified derivative snapshot on this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/storefront-mvp'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets assets/derivatives.json data/products.json docs/ASSET-PROVENANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified responsive photos and their provenance"
            git push origin HEAD:codex/storefront-mvp
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-check-output
          path: |
            test-results/
            dist/
